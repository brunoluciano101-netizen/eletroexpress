[build]
  publish = "."

[[redirects]]
  from = "http://eletroexpress.app.br/*"
  to = "https://eletroexpress.app.br/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"